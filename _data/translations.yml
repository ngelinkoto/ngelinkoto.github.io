  department: Département de chimie
  about_title: À propos
  about_p1: Je suis docteure en chimie et environnement, spécialisée en écotoxicologie. J’analyse la présence de polluants dans l’eau, les sédiments et les poissons pour mieux comprendre leurs effets sur l’environnement.
  about_p2: J’enseigne au Département de chimie de l’UPN depuis 2013 et je suis actuellement doyenne de la Faculté des Sciences et Technologies. Je dirige également le Centre de Recherche en Eau et Environnement (CREE). Mes recherches m’ont amenée à travailler avec des collègues de l’Université de Kinshasa et de l’Université de Genève.
