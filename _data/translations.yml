  research_title: Research
  research_intro: My research covers three related areas of chemistry and environmental science.
  research:
    - title: Water & ecotoxicology
      text: I study water quality and metal contamination in sediment and fish. These analyses help assess risks to aquatic environments.
      tags: Water quality · Pollution · Bioaccumulation
      topic: water
    - title: Ecosystems & environment
      text: I contribute to studies of Congo Basin peatlands. I also work on waste management and its effects on the environment.
      tags: Peatlands · Congo Basin · Sanitation
      topic: environment
    - title: Chemistry & natural resources
      text: I study the composition of plants and foods, including their mineral content and substances that can reduce nutrient absorption.
      tags: Phytochemistry · Analysis · Food resources
      topic: chemistry
