  about_label: ABOUT
  about_title: Research in service<br>of the environment.
  about_p1: With a doctorate in chemistry and environmental science and a specialisation in ecotoxicology, Patience Ngelinkoto Mpia studies pollution in water, sediment and fish. Her expertise combines physicochemical and toxicological analysis with environmental risk assessment.
  about_p2: Currently Dean of the Faculty of Sciences and Technologies at the National Pedagogical University (UPN), she brings together research, teaching and academic leadership. She also contributes to collaborative research with the University of Geneva and the University of Kinshasa.
  career: Career milestones
  career_note: Career details from the 2024 CV, updated with her current role as Dean.
