      text: National Pedagogical University (UPN), Kinshasa.
    - date: "2022"
      title: Scientific & academic leadership
      text: Took office as Director General of the Centre de Recherche en Eau et Environnement (CREE) and Dean of the Faculty of Sciences at UPN.
    - date: "2013"
      title: Professorship in chemistry
      text: Professor in the Department of Chemistry at Université Pédagogique Nationale.
    - date: PhD
      title: Chemistry & environmental science
      text: Specialisation in ecotoxicology, awarded with the highest distinction.
  research_label: RESEARCH AREAS
  research_title: Observe. Understand. Preserve.
  research_intro: From laboratory analysis to Congo Basin ecosystems, three complementary areas connect her research.
  research:
    - title: Water & ecotoxicology
      text: Assessing water quality and trace metal contamination in sediment and fish.
      tags: Water quality · Pollution · Bioaccumulation
      topic: water
    - title: Ecosystems & environment
      text: Characterising Congo Basin peatlands and investigating pressures on natural environments, alongside waste management.
      tags: Peatlands · Congo Basin · Sanitation
      topic: environment
    - title: Chemistry & natural resources
      text: Exploring chemical composition, mineral content and antinutritional factors in plant and food resources.
      tags: Phytochemistry · Analysis · Food resources
      topic: chemistry
