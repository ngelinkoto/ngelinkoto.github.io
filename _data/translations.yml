      text: Spécialité écotoxicologie. Mention « la plus grande distinction ».
  research_label: AXES DE RECHERCHE
  research_title: Observer. Comprendre. Préserver.
  research_intro: Des analyses en laboratoire aux écosystèmes du bassin du Congo, trois axes complémentaires structurent ses travaux.
  research:
    - title: Eau & écotoxicologie
      text: Évaluer la qualité des eaux et la contamination des sédiments et des poissons par les éléments traces métalliques.
      tags: Qualité de l’eau · Pollution · Bioaccumulation
      topic: water
    - title: Écosystèmes & environnement
      text: Caractériser les tourbières du bassin du Congo et étudier les pressions sur les milieux naturels, ainsi que la gestion des déchets.
      tags: Tourbières · Bassin du Congo · Assainissement
      topic: environment
    - title: Chimie & ressources naturelles
      text: Explorer la composition chimique, les éléments minéraux et les facteurs antinutritionnels de ressources végétales et alimentaires.
      tags: Phytochimie · Analyse · Ressources alimentaires
      topic: chemistry
