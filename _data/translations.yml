  about_title: About me
  about_p1: I hold a doctorate in chemistry and environmental science, specialising in ecotoxicology. I analyse pollutants in water, sediment and fish to understand their effects on the environment.
  about_p2: I have taught in UPN’s Department of Chemistry since 2013 and currently serve as Dean of the Faculty of Sciences and Technologies. I am also CEO of the Centre de Recherche en Eau et Environnement (CREE). My research has involved working with colleagues at the University of Kinshasa and the University of Geneva.
