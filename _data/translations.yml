  about_label: À PROPOS
  about_title: La recherche au service<br>de l’environnement.
  about_p1: Docteure en chimie et environnement, spécialisée en écotoxicologie, Patience Ngelinkoto Mpia étudie la pollution des eaux, des sédiments et des poissons. Son expertise associe analyses physico-chimiques et toxicologiques à l’évaluation des risques pour les milieux naturels.
  about_p2: Actuellement doyenne de la Faculté des Sciences et Technologies de l’Université Pédagogique Nationale (UPN), elle conjugue recherche, enseignement et responsabilités académiques. Elle contribue également à des travaux menés en collaboration avec l’Université de Genève et l’Université de Kinshasa.
