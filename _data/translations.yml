  research_title: Recherche
  research_intro: Mes travaux portent sur trois domaines liés à la chimie et à l’environnement.
  research:
    - title: Eau & écotoxicologie
      text: J’étudie la qualité de l’eau et la contamination des sédiments et des poissons par les métaux. Ces analyses permettent d’évaluer les risques pour les milieux aquatiques.
      tags: Qualité de l’eau · Pollution · Bioaccumulation
      topic: water
    - title: Écosystèmes & environnement
      text: Je contribue à l’étude des tourbières du bassin du Congo. Je participe également à des travaux sur la gestion des déchets et leurs effets sur l’environnement.
      tags: Tourbières · Bassin du Congo · Assainissement
      topic: environment
    - title: Chimie & ressources naturelles
      text: J’étudie la composition de plantes et d’aliments, notamment leur teneur en minéraux et en substances susceptibles de limiter l’absorption des nutriments.
      tags: Phytochimie · Analyse · Ressources alimentaires
      topic: chemistry
