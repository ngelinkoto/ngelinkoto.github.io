  description: J’étudie la qualité de l’eau et les effets des polluants sur les milieux aquatiques. Mes travaux portent notamment sur les rivières et les tourbières du bassin du Congo.
  discover: Voir mes publications
  cv: Consulter mon CV
  location: Kinshasa, République démocratique du Congo
  portrait: Portrait de la professeure Patience Ngelinkoto Mpia
